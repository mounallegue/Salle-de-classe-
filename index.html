<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle de classe virtuelle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS pour la signalisation et WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .active-audio { border: 2px solid #22c55e; box-shadow: 0 0 10px #22c55e; }
        .blackboard { background-color: #1e293b; border: 8px solid #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid font-bold fa-chalkboard-user text-emerald-400 text-2xl"></i>
            <h1 class="text-xl font-bold">Salle de classe virtuelle</h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="room-info" class="hidden flex items-center gap-4 text-sm bg-slate-700 px-4 py-1.5 rounded-full">
                <span>Code de salle : <strong id="display-room-code" class="text-emerald-400 select-all">---</strong></span>
                <span id="student-count-badge" class="bg-slate-600 px-2 py-0.5 rounded-full text-xs">Participants : 1</span>
            </div>
            <!-- Bouton Fin de Séance (Professeur uniquement) -->
            <button id="btn-end-session" onclick="endSession()" class="hidden bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-power-off"></i> Terminer la séance
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Role Selection Modal -->
        <div id="role-modal" class="absolute inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full border border-slate-700 shadow-2xl text-center">
                <h2 class="text-2xl font-bold mb-6 text-emerald-400">Connexion à la classe</h2>
                
                <!-- Section Professeur (Email Unique et Fixe) -->
                <div class="space-y-3 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-emerald-300 text-right">Espace Professeur (Administrateur)</h3>
                    <input type="email" id="teacher-email-input" placeholder="Entrez l'email autorisé (ex: prof@gmail.com)" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-emerald-500 text-sm">
                    <button onclick="verifyAndSetupTeacher()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition text-sm">
                        <i class="fa-solid fa-user-tie"></i> Connexion Professeur
                    </button>
                </div>

                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-600"></div></div>
                    <div class="relative flex justify-center text-xs text-slate-400"><span class="bg-slate-800 px-2">ou</span></div>
                </div>

                <!-- Section Élève (Nom + Code de salle uniquement) -->
                <div class="space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-blue-300 text-right">Espace Élève</h3>
                    <input type="text" id="student-name" placeholder="Votre Nom et Prénom" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500 text-sm">
                    <input type="text" id="room-code-input" placeholder="Code de la salle (ex: 482910)" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500 text-sm">
                    <button onclick="setupStudent()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition text-sm">
                        <i class="fa-solid fa-graduation-cap"></i> Rejoindre la classe
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Display / Blackboard -->
        <main class="flex-1 flex flex-col p-4 bg-slate-950 relative">
            <div class="flex-1 blackboard rounded-2xl flex items-center justify-center relative overflow-hidden shadow-inner">
                <video id="main-video" autoplay playsinline class="w-full h-full object-contain hidden"></video>
                
                <div id="waiting-placeholder" class="text-center p-8 space-y-4">
                    <i class="fa-solid fa-desktop text-6xl text-slate-600 animate-pulse"></i>
                    <p id="placeholder-text" class="text-slate-400 text-lg">Le cours apparaîtra dès que le professeur partagera son écran.</p>
                </div>
            </div>

            <!-- Controls Bar -->
            <div id="controls-bar" class="mt-4 bg-slate-800 p-3 rounded-xl flex items-center justify-between border border-slate-700 hidden">
                <div class="flex items-center gap-3">
                    <button id="btn-mic" onclick="toggleMic()" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white transition" title="Activer/Couper le micro">
                        <i class="fa-solid fa-microphone-slash text-red-400"></i>
                    </button>

                    <!-- Teacher Controls -->
                    <div id="teacher-controls" class="hidden flex items-center gap-3">
                        <button id="btn-share" onclick="toggleScreenShare()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-display"></i> Partager l'écran
                        </button>
                        <button id="btn-record" onclick="toggleRecording()" class="bg-red-600 hover:bg-red-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-circle"></i> Enregistrer
                        </button>
                    </div>

                    <!-- Student Controls -->
                    <div id="student-controls" class="hidden flex items-center gap-3">
                        <button id="btn-raise-hand" onclick="raiseHand()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-hand"></i> Lever la main
                        </button>
                    </div>
                </div>

                <!-- Right Side Toggles -->
                <div class="flex items-center gap-3">
                    <button id="btn-toggle-list" onclick="toggleSidebar('list')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white hidden relative" title="Liste des élèves">
                        <i class="fa-solid fa-users"></i>
                    </button>
                    <button id="btn-toggle-chat" onclick="toggleSidebar('chat')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white relative" title="Messages">
                        <i class="fa-solid fa-comments"></i>
                        <span id="chat-badge" class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 rounded-full hidden"></span>
                    </button>
                    <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white" title="Plein écran">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Sidebar: Roster (Teacher only) -->
        <aside id="sidebar-roster" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-users"></i> Liste des élèves</h3>
                <div class="flex gap-1">
                    <button onclick="muteAllStudents(true)" class="bg-red-600/20 text-red-400 p-1.5 rounded text-xs">Tout couper</button>
                    <button onclick="muteAllStudents(false)" class="bg-emerald-600/20 text-emerald-400 p-1.5 rounded text-xs">Tout activer</button>
                </div>
            </div>
            <div id="roster-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        </aside>

        <!-- Sidebar: Chat (One-Way) -->
        <aside id="sidebar-chat" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-comments"></i> Espace Messages</h3>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-3 border-t border-slate-700 flex gap-2">
                <input type="text" id="chat-input" placeholder="Écrire un message..." class="flex-1 bg-slate-700 px-3 py-2 rounded-lg text-sm text-white focus:outline-none">
                <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-white"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </aside>

    </div>

    <!-- Script Logique Optimisé -->
    <script>
        // الإيميل الوحيد المصرح له كأستاذ (يمكنك تعديله هنا)
        const AUTHORIZED_TEACHER_EMAIL = "prof.salle@gmail.com";
        
        let isTeacher = false;
        let peer = null;
        let myStream = null;
        let screenStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let connections = {};
        let activeCalls = {};

        function verifyAndSetupTeacher() {
            const emailInput = document.getElementById('teacher-email-input').value.trim().toLowerCase();
            
            if(emailInput !== AUTHORIZED_TEACHER_EMAIL.toLowerCase()) {
                alert("Accès refusé : Cet email n'est pas autorisé en tant qu'administrateur/professeur de cette application.");
                return;
            }

            isTeacher = true;
            // تثبيت كود قاعة ثابت أو مولد للأستاذ
            const roomCode = "123456"; 
            document.getElementById('display-room-code').innerText = roomCode;
            initPeer(roomCode);
            showTeacherUI();
        }

        function setupStudent() {
            const name = document.getElementById('student-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim();
            if(!name || !code) return alert('Veuillez entrer votre nom et le code de la salle');
            
            isTeacher = false;
            initPeer(null);
            connectToTeacher(code, name);
            showStudentUI();
        }

        function initPeer(id) {
            peer = id ? new Peer(id) : new Peer();
            
            peer.on('open', () => {
                document.getElementById('role-modal').classList.add('hidden');
                document.getElementById('room-info').classList.remove('hidden');
                document.getElementById('controls-bar').classList.remove('hidden');
            });

            peer.on('call', (call) => {
                call.answer(myStream || undefined);
                activeCalls[call.peer] = call;
                
                call.on('stream', (remoteStream) => {
                    handleIncomingStream(remoteStream);
                });
            });

            peer.on('connection', (conn) => {
                handleDataConnection(conn);
            });
        }

        function connectToTeacher(teacherId, name) {
            peer.on('open', () => {
                const conn = peer.connect(teacherId, { metadata: { name: name } });
                handleDataConnection(conn);
                
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    myStream = stream;
                    stream.getAudioTracks()[0].enabled = false; // Mémorisé muet par défaut
                    const call = peer.call(teacherId, stream);
                    activeCalls[teacherId] = call;
                    
                    call.on('stream', (remoteStream) => {
                        handleIncomingStream(remoteStream);
                    });
                }).catch(err => {
                    console.warn("Microphone non disponible, connexion en mode écoute seule.");
                    peer.call(teacherId, new MediaStream());
                });
            });
        }

        function showTeacherUI() {
            document.getElementById('teacher-controls').classList.remove('hidden');
            document.getElementById('btn-end-session').classList.remove('hidden');
            document.getElementById('btn-toggle-list').classList.remove('hidden');
            document.getElementById('sidebar-roster').classList.remove('hidden');
            addRosterItem(peer.id, 'Professeur (Vous)', true);
        }

        function showStudentUI() {
            document.getElementById('student-controls').classList.remove('hidden');
        }

        function toggleSidebar(type) {
            const roster = document.getElementById('sidebar-roster');
            const chat = document.getElementById('sidebar-chat');
            if(type === 'list') {
                roster.classList.toggle('hidden');
                chat.classList.add('hidden');
            } else {
                chat.classList.toggle('hidden');
                roster.classList.add('hidden');
                document.getElementById('chat-badge').classList.add('hidden');
            }
        }

        async function toggleScreenShare() {
            if(!screenStream) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const videoElem = document.getElementById('main-video');
                    videoElem.srcObject = screenStream;
                    videoElem.classList.remove('hidden');
                    document.getElementById('waiting-placeholder').classList.add('hidden');
                    
                    broadcastScreenStream();

                    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                    document.getElementById('btn-share').classList.replace('bg-emerald-600', 'bg-amber-600');
                    document.getElementById('btn-share').innerHTML = `<i class="fa-solid fa-stop"></i> Arrêter le partage`;
                } catch(e) { console.error("Erreur partage d'écran:", e); }
            } else {
                stopScreenShare();
            }
        }

        function broadcastScreenStream() {
            if (!screenStream) return;
            Object.keys(connections).forEach(peerId => {
                const call = peer.call(peerId, screenStream);
                activeCalls[peerId] = call;
            });
        }

        function stopScreenShare() {
            if(screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
                document.getElementById('main-video').classList.add('hidden');
                document.getElementById('waiting-placeholder').classList.remove('hidden');
                document.getElementById('btn-share').classList.replace('bg-amber-600', 'bg-emerald-600');
                document.getElementById('btn-share').innerHTML = `<i class="fa-solid fa-display"></i> Partager l'écran`;
                
                Object.values(connections).forEach(conn => {
                    conn.send({ type: 'STOP_SCREEN' });
                });
            }
        }

        function handleIncomingStream(stream) {
            const videoElem = document.getElementById('main-video');
            if(stream && stream.getVideoTracks().length > 0) {
                videoElem.srcObject = stream;
                videoElem.classList.remove('hidden');
                document.getElementById('waiting-placeholder').classList.add('hidden');
            }
        }

        async function toggleMic() {
            if(!myStream) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch(e) {
                    alert("Accès au microphone refusé.");
                    return;
                }
            }
            const track = myStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            
            const btn = document.getElementById('btn-mic');
            if(track.enabled) {
                btn.innerHTML = `<i class="fa-solid fa-microphone text-emerald-400"></i>`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-microphone-slash text-red-400"></i>`;
            }
        }

        function muteAllStudents(muteState) {
            Object.values(connections).forEach(conn => {
                conn.send({ type: 'COMMAND_MUTE', payload: muteState });
            });
        }

        function handleDataConnection(conn) {
            connections[conn.peer] = conn;

            conn.on('data', (data) => {
                if(data.type === 'CHAT') {
                    appendMessage(data.sender, data.text);
                    if(document.getElementById('sidebar-chat').classList.contains('hidden')) {
                        document.getElementById('chat-badge').classList.remove('hidden');
                    }
                } else if(data.type === 'HAND_RAISE') {
                    alert(`Un élève a levé la main : ${data.sender}`);
                } else if(data.type === 'COMMAND_MUTE' && !isTeacher) {
                    if(myStream && myStream.getAudioTracks().length > 0) {
                        myStream.getAudioTracks()[0].enabled = !data.payload;
                        const btn = document.getElementById('btn-mic');
                        btn.innerHTML = data.payload ? `<i class="fa-solid fa-microphone-slash text-red-400"></i>` : `<i class="fa-solid fa-microphone text-emerald-400"></i>`;
                    }
                    alert(data.payload ? "Votre micro a été coupé par le professeur." : "Votre micro a été activé par le professeur.");
                } else if(data.type === 'STOP_SCREEN' && !isTeacher) {
                    document.getElementById('main-video').classList.add('hidden');
                    document.getElementById('waiting-placeholder').classList.remove('hidden');
                } else if(data.type === 'END_SESSION' && !isTeacher) {
                    alert("La séance a été terminée par le professeur.");
                    location.reload();
                }
            });

            conn.on('open', () => {
                if(isTeacher) {
                    const studentName = conn.metadata ? conn.metadata.name : 'Élève';
                    addRosterItem(conn.peer, studentName, false);
                    updateStudentCount();
                    
                    if(screenStream) {
                        setTimeout(() => {
                            peer.call(conn.peer, screenStream);
                        }, 1000);
                    }
                }
            });

            conn.on('close', () => {
                if(isTeacher) {
                    removeRosterItem(conn.peer);
                    updateStudentCount();
                }
            });
        }

        function endSession() {
            if(confirm('Voulez-vous vraiment terminer la séance pour tous les participants ?')) {
                Object.values(connections).forEach(conn => {
                    conn.send({ type: 'END_SESSION' });
                });
                location.reload();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            appendMessage('Moi', text);
            Object.values(connections).forEach(conn => {
                conn.send({ type: 'CHAT', sender: isTeacher ? 'Professeur' : 'Élève', text: text });
            });
            input.value = '';
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const msgNode = document.createElement('div');
            msgNode.className = "bg-slate-700 p-2.5 rounded-lg text-sm";
            msgNode.innerHTML = `<strong class="text-emerald-400 block text-xs">${sender}</strong><p>${text}</p>`;
            box.appendChild(msgNode);
            box.scrollTop = box.scrollHeight;
        }

        function raiseHand() {
            Object.values(connections).forEach(conn => {
                conn.send({ type: 'HAND_RAISE', sender: 'Élève' });
            });
            alert('Votre signal de main levée a été envoyé au professeur.');
        }

        function addRosterItem(id, name, isSelf) {
            const list = document.getElementById('roster-list');
            const item = document.createElement('div');
            item.id = `user-${id}`;
            item.className = "flex items-center justify-between bg-slate-700 p-2.5 rounded-lg text-sm";
            item.innerHTML = `<span>${name}</span><i class="fa-solid fa-microphone text-slate-400"></i>`;
            list.appendChild(item);
        }

        function removeRosterItem(id) {
            const item = document.getElementById(`user-${id}`);
            if(item) item.remove();
        }

        function updateStudentCount() {
            const count = Object.keys(connections).length + 1;
            document.getElementById('student-count-badge').innerText = `Participants : ${count}`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleRecording() {
            if(!recordedChunks.length && !mediaRecorder) {
                const streamToRecord = screenStream || myStream;
                if(!streamToRecord) return alert("Aucun contenu à enregistrer ! Partagez d'abord votre écran.");
                
                mediaRecorder = new MediaRecorder(streamToRecord, { mimeType: 'video/webm;codecs=vp9,opus' });
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideoFile;
                mediaRecorder.start();
                document.getElementById('btn-record').innerHTML = `<i class="fa-solid fa-stop"></i> Stop Enregistrement`;
                document.getElementById('btn-record').classList.replace('bg-red-600', 'bg-amber-600');
            } else {
                mediaRecorder.stop();
            }
        }

        function saveVideoFile() {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cours_${new Date().toISOString().slice(0,10)}.mp4`;
            a.click();
            recordedChunks = [];
            mediaRecorder = null;
            document.getElementById('btn-record').innerHTML = `<i class="fa-solid fa-circle"></i> Enregistrer`;
            document.getElementById('btn-record').classList.replace('bg-amber-600', 'bg-red-600');
        }
    </script>
</body>
</html>
