<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle de classe virtuelle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Daily.co SFU SDK -->
    <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
    <style>
        .blackboard { background-color: #1e293b; border: 8px solid #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid font-bold fa-chalkboard-user text-emerald-400 text-2xl"></i>
            <h1 class="text-xl font-bold">Salle de classe virtuelle</h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="room-info" class="hidden flex items-center gap-4 text-sm bg-slate-700 px-4 py-1.5 rounded-full">
                <span>Salle : <strong class="text-emerald-400">visioclasse</strong></span>
                <span id="student-count-badge" class="bg-slate-600 px-2 py-0.5 rounded-full text-xs">Participants : 1</span>
            </div>
            <!-- Bouton Fin de Séance (Professeur uniquement) -->
            <button id="btn-end-session" onclick="endSession()" class="hidden bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-power-off"></i> Terminer la séance
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Role Selection Modal -->
        <div id="role-modal" class="absolute inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full border border-slate-700 shadow-2xl text-center">
                <h2 class="text-2xl font-bold mb-6 text-emerald-400">Connexion à la classe</h2>
                
                <!-- Section Professeur -->
                <div class="space-y-3 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-emerald-300 text-right">Espace Professeur</h3>
                    <input type="email" id="teacher-email-input" placeholder="Email (ex: prof.salle@gmail.com)" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-emerald-500 text-sm">
                    <button onclick="setupTeacher()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition text-sm">
                        <i class="fa-solid fa-user-tie"></i> Connexion Professeur
                    </button>
                </div>

                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-600"></div></div>
                    <div class="relative flex justify-center text-xs text-slate-400"><span class="bg-slate-800 px-2">ou</span></div>
                </div>

                <!-- Section Élève -->
                <div class="space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-blue-300 text-right">Espace Élève</h3>
                    <input type="text" id="student-name" placeholder="Nom et Prénom de l'élève" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500 text-sm">
                    <input type="text" id="room-code-input" placeholder="Nom de la salle (ex: visioclasse)" class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500 text-sm">
                    <button onclick="setupStudent()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition text-sm">
                        <i class="fa-solid fa-graduation-cap"></i> Rejoindre la classe
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Display / Blackboard -->
        <main class="flex-1 flex flex-col p-4 bg-slate-950 relative">
            <div class="flex-1 blackboard rounded-2xl flex items-center justify-center relative overflow-hidden shadow-inner">
                <video id="main-video" autoplay playsinline class="w-full h-full object-contain hidden"></video>
                
                <div id="waiting-placeholder" class="text-center p-8 space-y-4">
                    <i class="fa-solid fa-desktop text-6xl text-slate-600 animate-pulse"></i>
                    <p id="placeholder-text" class="text-slate-400 text-lg">Le cours apparaîtra dès que le professeur partagera son écran.</p>
                </div>
            </div>

            <!-- Controls Bar -->
            <div id="controls-bar" class="mt-4 bg-slate-800 p-3 rounded-xl flex items-center justify-between border border-slate-700 hidden">
                <div class="flex items-center gap-3">
                    <button id="btn-mic" onclick="toggleMic()" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white transition">
                        <i class="fa-solid fa-microphone-slash text-red-400"></i>
                    </button>

                    <!-- Teacher Controls -->
                    <div id="teacher-controls" class="hidden flex items-center gap-3">
                        <button id="btn-share" onclick="toggleScreenShare()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-display"></i> Partager l'écran
                        </button>
                        <button id="btn-record" onclick="toggleRecording()" class="bg-red-600 hover:bg-red-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-circle"></i> Enregistrer
                        </button>
                    </div>

                    <!-- Student Controls -->
                    <div id="student-controls" class="hidden flex items-center gap-3">
                        <button id="btn-raise-hand" onclick="raiseHand()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-hand"></i> Lever la main
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="btn-toggle-list" onclick="toggleSidebar('list')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white hidden relative">
                        <i class="fa-solid fa-users"></i>
                    </button>
                    <button id="btn-toggle-chat" onclick="toggleSidebar('chat')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white relative">
                        <i class="fa-solid fa-comments"></i>
                        <span id="chat-badge" class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 rounded-full hidden"></span>
                    </button>
                    <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-white">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Sidebar Roster -->
        <aside id="sidebar-roster" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-users"></i> Liste des élèves</h3>
                <div class="flex gap-1">
                    <button onclick="muteAllStudents(true)" class="bg-red-600/20 text-red-400 p-1.5 rounded text-xs">Tout couper</button>
                    <button onclick="muteAllStudents(false)" class="bg-emerald-600/20 text-emerald-400 p-1.5 rounded text-xs">Tout activer</button>
                </div>
            </div>
            <div id="roster-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        </aside>

        <!-- Sidebar Chat -->
        <aside id="sidebar-chat" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-comments"></i> Espace Messages</h3>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-3 border-t border-slate-700 flex gap-2">
                <input type="text" id="chat-input" placeholder="Écrire un message..." class="flex-1 bg-slate-700 px-3 py-2 rounded-lg text-sm text-white focus:outline-none">
                <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-white"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </aside>

    </div>

    <script>
        const AUTHORIZED_TEACHER_EMAIL = "prof.salle@gmail.com";
        // Daily.co room URL configured for this application.
        const DAILY_ROOM_URL = "https://visioclasse.daily.co/visioclasse";

        let isTeacher = false;
        let callObject = null;
        let isSharingScreen = false;
        let mediaRecorder = null;
        let recordedChunks = [];

        async function setupTeacher() {
            const email = document.getElementById('teacher-email-input').value.trim().toLowerCase();
            if(!email || !email.includes('@')) {
                alert("Veuillez entrer une adresse email valide.");
                return;
            }

            isTeacher = true;
            await initDailyCall(true, "Professeur (Admin)");
            document.getElementById('teacher-controls').classList.remove('hidden');
            document.getElementById('btn-end-session').classList.remove('hidden');
            document.getElementById('btn-toggle-list').classList.remove('hidden');
            document.getElementById('sidebar-roster').classList.remove('hidden');
        }

        async function setupStudent() {
            const name = document.getElementById('student-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim().toLowerCase();
            if(!name || code !== "visioclasse") return alert('Nom invalide ou Nom de salle incorrect (Utilisez: visioclasse)');

            isTeacher = false;
            await initDailyCall(false, name);
            document.getElementById('student-controls').classList.remove('hidden');
        }

        async function initDailyCall(isOwner, userName) {
            callObject = DailyIframe.createCallObject({
                audioSource: true,
                videoSource: false 
            });

            callObject
                .on('joined-meeting', updateParticipantsUI)
                .on('participant-joined', updateParticipantsUI)
                .on('participant-left', updateParticipantsUI)
                .on('track-started', handleTrackStarted)
                .on('track-stopped', handleTrackStopped)
                .on('app-message', handleAppMessage);

            await callObject.join({
                url: DAILY_ROOM_URL,
                userName: userName,
                startVideoOff: true,
                startAudioOff: !isOwner 
            });

            document.getElementById('role-modal').classList.add('hidden');
            document.getElementById('room-info').classList.remove('hidden');
            document.getElementById('controls-bar').classList.remove('hidden');

            updateMicUI(isOwner);
        }

        function updateParticipantsUI() {
            if(!callObject) return;
            const participants = callObject.participants();
            const count = Object.keys(participants).length;
            
            document.getElementById('student-count-badge').innerText = `Participants : ${count}`;

            if(isTeacher) {
                const list = document.getElementById('roster-list');
                list.innerHTML = '';
                Object.values(participants).forEach(p => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-slate-700 p-2.5 rounded-lg text-sm";
                    const isMicOn = p.audio;
                    item.innerHTML = `
                        <span>${p.user_name || 'Élève'} ${p.local ? '(Vous)' : ''}</span>
                        <i class="fa-solid ${isMicOn ? 'fa-microphone text-emerald-400' : 'fa-microphone-slash text-slate-400'}"></i>
                    `;
                    list.appendChild(item);
                });
            }
        }

        function handleTrackStarted(evt) {
            if (evt.track.kind === 'video') {
                const videoElem = document.getElementById('main-video');
                videoElem.srcObject = new MediaStream([evt.track]);
                videoElem.classList.remove('hidden');
                document.getElementById('waiting-placeholder').classList.add('hidden');
            }
        }

        function handleTrackStopped(evt) {
            if (evt.track.kind === 'video') {
                document.getElementById('main-video').classList.add('hidden');
                document.getElementById('waiting-placeholder').classList.remove('hidden');
            }
        }

        async function toggleScreenShare() {
            if (!isSharingScreen) {
                try {
                    await callObject.startScreenShare();
                    isSharingScreen = true;
                    document.getElementById('btn-share').classList.replace('bg-emerald-600', 'bg-amber-600');
                    document.getElementById('btn-share').innerHTML = `<i class="fa-solid fa-stop"></i> Arrêter le partage`;
                } catch(e) { console.error(e); }
            } else {
                await callObject.stopScreenShare();
                isSharingScreen = false;
                document.getElementById('btn-share').classList.replace('bg-amber-600', 'bg-emerald-600');
                document.getElementById('btn-share').innerHTML = `<i class="fa-solid fa-display"></i> Partager l'écran`;
            }
        }

        async function toggleMic() {
            const localParticipant = callObject.participants().local;
            const currentAudio = localParticipant.audio;
            await callObject.setLocalAudio(!currentAudio);
            updateMicUI(!currentAudio);
        }

        function updateMicUI(enabled) {
            const btn = document.getElementById('btn-mic');
            btn.innerHTML = enabled ? 
                `<i class="fa-solid fa-microphone text-emerald-400"></i>` : 
                `<i class="fa-solid fa-microphone-slash text-red-400"></i>`;
        }

        function muteAllStudents(muteState) {
            if (!isTeacher) return;
            callObject.sendAppMessage({ type: 'COMMAND_MUTE', payload: muteState });
        }

        function handleAppMessage(evt) {
            const data = evt.data;
            if (data.type === 'CHAT') {
                appendMessage(data.sender, data.text);
            } else if (data.type === 'HAND_RAISE' && isTeacher) {
                alert(`Un élève a levé la main : ${data.sender}`);
            } else if (data.type === 'COMMAND_MUTE' && !isTeacher) {
                callObject.setLocalAudio(!data.payload);
                updateMicUI(!data.payload);
                alert(data.payload ? "Votre micro a été coupé." : "Votre micro a été activé.");
            } else if (data.type === 'END_SESSION' && !isTeacher) {
                alert("La séance a été terminée.");
                location.reload();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const senderName = isTeacher ? 'Professeur' : 'Élève';
            appendMessage('Moi', text);
            callObject.sendAppMessage({ type: 'CHAT', sender: senderName, text: text });
            input.value = '';
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const msgNode = document.createElement('div');
            msgNode.className = "bg-slate-700 p-2.5 rounded-lg text-sm";
            msgNode.innerHTML = `<strong class="text-emerald-400 block text-xs">${sender}</strong><p>${text}</p>`;
            box.appendChild(msgNode);
            box.scrollTop = box.scrollHeight;
        }

        function raiseHand() {
            callObject.sendAppMessage({ type: 'HAND_RAISE', sender: callObject.participants().local.user_name });
            alert('Votre signal a été envoyé.');
        }

        function endSession() {
            if(confirm('Terminer la séance pour tous ?')) {
                callObject.sendAppMessage({ type: 'END_SESSION' });
                callObject.leave();
                location.reload();
            }
        }

        function toggleSidebar(type) {
            const roster = document.getElementById('sidebar-roster');
            const chat = document.getElementById('sidebar-chat');
            if(type === 'list') {
                roster.classList.toggle('hidden');
                chat.classList.add('hidden');
            } else {
                chat.classList.toggle('hidden');
                roster.classList.add('hidden');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleRecording() {
            const videoElem = document.getElementById('main-video');
            if(!recordedChunks.length && !mediaRecorder) {
                if(!videoElem.srcObject) return alert("Partagez votre écran pour enregistrer !");
                mediaRecorder = new MediaRecorder(videoElem.srcObject, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = saveVideoFile;
                mediaRecorder.start();
                document.getElementById('btn-record').innerHTML = `<i class="fa-solid fa-stop"></i> Stop Enregistrement`;
            } else {
                mediaRecorder.stop();
            }
        }

        function saveVideoFile() {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cours_${new Date().toISOString().slice(0,10)}.mp4`;
            a.click();
            recordedChunks = [];
            mediaRecorder = null;
            document.getElementById('btn-record').innerHTML = `<i class="fa-solid fa-circle"></i> Enregistrer`;
        }
    </script>
</body>
</html>
